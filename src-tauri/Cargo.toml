[package]
name = "mixlab"
version = "0.1.0"
description = "Software de DJ profissional com processamento de áudio em tempo real"
authors = ["MixLab Contributors"]
license = "MIT"
repository = "https://github.com/<SEU_USUARIO>/MixLab"
homepage = "https://github.com/<SEU_USUARIO>/MixLab"
documentation = "https://github.com/<SEU_USUARIO>/MixLab#readme"
readme = "../../../README.md"
keywords = ["dj", "audio", "mixer", "tauri", "rust", "react", "realtime"]
categories = ["multimedia", "audio", "gui"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mixlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "wav", "aac", "flac", "ogg"] }
realfft = "3.5.0"
num-complex = "0.4.6"
cpal = "0.18.2"

# Dev dependencies para testes
[dev-dependencies]
serial_test = "3.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Profile para desenvolvimento com debug symbols
[profile.dev]
debug = 2
opt-level = 0

# Configuração de testes
[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"