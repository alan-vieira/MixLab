[package]
name = "mixlab"
version = "0.1.2"
description = "Software de DJ profissional com processamento de áudio em tempo real"
authors = ["MixLab Contributors"]
license = "MIT"
repository = "https://github.com/alan-vieira/MixLab"
edition = "2021"

[lib]
name = "mixlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "wav", "aac", "flac", "ogg"] }
realfft = "3.5.0"
num-complex = "0.4.6"
cpal = "0.15.3"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
serial_test = "3.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = 2
opt-level = 0

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
