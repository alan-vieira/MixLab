name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*'] # ADICIONADO: Aciona o workflow ao criar uma tag (ex: v1.0.0)
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # 1. VERIFICAÇÕES (Rust e Frontend)
  # ============================================================
  rust-checks:
    name: Rust Checks (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test -- --nocapture

      - name: Build release
        run: cargo build --release

  frontend-checks:
    name: Frontend Checks (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Build production
        run: npm run build

  # ============================================================
  # 2. BUILD E RELEASE MULTIPLATAFORMA (Unificado com Matrix)
  # ============================================================
  publish-tauri:
    name: Tauri Build & Release
    needs: [rust-checks, frontend-checks] # Garante que os testes passem antes de buildar
    if: startsWith(github.ref, 'refs/tags/v') # SÓ executa quando uma tag 'v*' for enviada
    permissions:
      contents: write # Necessário para criar a release no GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin' # Compila para Intel e Apple Silicon em um único binário

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app and Create Release
        uses: tauri-apps/tauri-action@v1 # ATUALIZADO para v1 (estável e suporta consolidação de releases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # Usa a tag enviada (ex: v1.0.0)
          releaseName: 'MixLab ${{ github.ref_name }}'
          releaseBody: 'Build automático multiplataforma gerado pelo GitHub Actions.'
          releaseDraft: true # Mude para 'false' quando quiser que a release seja publicada automaticamente
          prerelease: false
          args: ${{ matrix.args }}